apply plugin: 'com.android.application'


android {
    namespace 'com.project.aplikasi.petugas_cbs'

    compileSdk 35
    defaultConfig {
        applicationId "com.project.aplikasi.petugas_cbs.evoucher"
        minSdkVersion 23
        targetSdkVersion 35
        versionCode 1
        versionName "1.0"

    }
    buildFeatures {
        buildConfig = true
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
//
//    sourceSets {
//        main {
//            res.srcDirs = getLayoutList("app/src/main/res/layouts/")
//        }
//    }
}

dependencies {


    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    implementation 'androidx.fragment:fragment:1.3.6'
    implementation 'androidx.navigation:navigation-fragment:2.0.0'
    implementation 'androidx.navigation:navigation-ui:2.0.0'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.0.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.activity:activity:1.8.0'
    implementation 'androidx.gridlayout:gridlayout:1.0.0'
    //menampilkan GIF
    implementation 'pl.droidsonroids.gif:android-gif-drawable:1.2.0'

    implementation 'com.google.android.gms:play-services-location:17.0.0'
    implementation 'com.google.android.gms:play-services-maps:17.0.0'

    // retorfit
    implementation "com.squareup.retrofit2:retrofit:2.5.0"
    implementation "com.squareup.retrofit2:converter-gson:2.5.0"
    implementation "com.squareup.retrofit2:adapter-rxjava2:2.5.0"
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'

    // logging untuk retrofit
    implementation 'com.squareup.okhttp3:okhttp:3.3.1'
    implementation 'com.squareup.okhttp3:logging-interceptor:3.10.0'

    //qrcode
    implementation('com.journeyapps:zxing-android-embedded:4.3.0') { transitive = false }
    implementation 'com.google.zxing:core:3.3.0'


    //qrcode2
    implementation 'me.dm7.barcodescanner:zxing:1.9'

    //Picasso Gambar Internet
    implementation 'com.squareup.picasso:picasso:2.71828'

    //Animasi Loading
    implementation 'com.github.bumptech.glide:glide:3.7.0'

    //Printer
    implementation 'com.github.DantSu:ESCPOS-ThermalPrinter-Android:2.0.11'

    def camerax_version = "1.0.2"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"

    implementation "androidx.camera:camera-view:1.5.2"
    implementation "com.google.mlkit:barcode-scanning:17.3.0"
}
